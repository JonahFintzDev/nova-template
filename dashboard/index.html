<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nova Template - Base for Nova apps" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Nova Template</title>
    <!-- Geist fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Anti-FOUC: apply theme before first paint -->
    <script>
      (function () {
        var stored = localStorage.getItem('darkTheme');
        var light  = localStorage.getItem('lightTheme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var auto = localStorage.getItem('autoTheme');
        var isDark;
        if (auto === 'true' || (!stored && !light)) {
          isDark = prefersDark;
        } else if (stored && !light) {
          isDark = true;
        } else {
          isDark = !light;
        }
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
